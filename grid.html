<!DOCTYPE html>
<html>
    <head>
        <title>
            Grid practice
        </title>
    </head>
    <body style="padding-bottom: 1000px;">
        <div style="
            display:grid ;
            grid-template-columns:100px 100px ;">
            <div style="background-color: pink;"> DIV 1 </div>
            <div style="background-color: burlywood;"> DIV 2 <p>srushti</p></div>
        </div>

            <div style="
            margin-top: 20px;
                display:grid ;
                grid-template-columns:100px 100px ;">
                <div style="background-color: pink;"> DIV 1 </div>
                <div style="background-color: burlywood;"> DIV 2 <p>srushti</p></div>
                <div style="background-color: blue;"> DIV 3 </div>
            </div>

            <div style="
            margin-top: 20px;
            display:grid ;
            grid-template-columns:100px 1fr ;">
            <div style="background-color: pink;"> DIV 1 </div>
            <div style="background-color: burlywood;"> 1fr </div>
        </div>

        <div style="
        margin-top: 30px;
        display:grid ;
        grid-template-columns:100px 1fr  1fr;">
        <div style="background-color: pink;"> DIV 1 </div>
        <div style="background-color: burlywood;"> 1fr </div>
        <div style="background-color: skyblue;"> 1fr </div>
    </div>

    <div style="
    margin-top: 30px;
    margin-bottom: 30px;
    display:grid ;
    column-gap: 20px;
    row-gap: 40px;
    grid-template-columns:1fr 1fr  1fr;">
    <div style="background-color: pink;height: 200px;"> 1fr</div>
    <div style="background-color: burlywood;height: 200px;"> 1fr </div>
    <div style="background-color: skyblue;height: 200px;"> 1fr </div>
    <div style="background-color: pink;height: 200px;"> 1fr </div>
    <div style="background-color: burlywood;height: 200px"> 1fr </div>
    <div style="background-color: skyblue;height: 200px"> 1fr </div>
    <div style="background-color: pink;height: 200px;"> 1fr </div>
    <div style="background-color: burlywood;height: 200px"> 1fr </div>
    <div style="background-color: skyblue;height: 200px"> 1fr </div>
    <div style="background-color: pink;height: 200px;"> 1fr </div>
    <div style="background-color: burlywood;height: 200px"> 1fr </div>
    <div style="background-color: skyblue;height: 200px"> 1fr </div>
    </div>
    </body>
</html>
